<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otimização - NHOOF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0b0b;
            color: #dbdee1;
            overflow: hidden;
        }

        /* Layout Principal do Estilo Discord */
        .discord-app {
            display: flex;
            width: 100vw;
            height: 100vh;
            padding-top: 70px;
        }

        /* Cabeçalho Global Fixo (Idêntico à Vitrine) */
        header.global-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.8rem 3.5rem;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(11,11,11,0.9) 0%, rgba(11,11,11,0) 100%);
        }

        .logo-container a {
            display: inline-block;
        }

        .logo-container img {
            height: 3.8rem;
            width: auto;
            display: block;
        }

        nav {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 1.8rem;
            align-items: center;
        }

        nav ul li a {
            text-decoration: none;
            color: #a0a0a0;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        nav ul li a:hover, nav ul li a.active {
            color: #ffffff;
        }

        .header-spacer {
            width: 3.8rem;
        }

        /* 1. Barra Lateral de Canais (Esquerda) */
        .sidebar-channels {
            width: 260px;
            background-color: #0b0b0b;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1a1a1a;
            height: calc(100vh - 70px);
            padding-top: 0.5rem;
        }

        .channels-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .channels-list::-webkit-scrollbar {
            width: 4px;
        }
        .channels-list::-webkit-scrollbar-thumb {
            background-color: #222;
            border-radius: 2px;
        }

        /* Categorias Ocultáveis */
        .category-header {
            font-size: 0.75rem;
            font-weight: bold;
            color: #80848e;
            text-transform: uppercase;
            padding: 0.5rem 0.2rem 0.2rem 0.2rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            gap: 4px;
        }

        .category-header:hover {
            color: #dbdee1;
        }

        .category-arrow {
            font-size: 0.65rem;
            transition: transform 0.2s ease;
        }

        .category-content {
            display: flex;
            flex-direction: column;
            gap: 1px;
            overflow: hidden;
            transition: max-height 0.25s ease;
        }

        .category-content.collapsed {
            max-height: 0 !important;
        }

        .channel-item {
            display: flex;
            align-items: center;
            padding: 0.35rem 0.5rem;
            border-radius: 4px;
            color: #949ba4;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.15s, color 0.15s;
        }

        .channel-item:hover {
            background-color: #161616;
            color: #dbdee1;
        }

        .channel-item.active {
            background-color: #1f1f1f;
            color: #ffffff;
            font-weight: 500;
        }

        .channel-item span {
            margin-right: 6px;
            font-size: 1rem;
            color: #6d6f78;
        }

        /* 2. Área Principal do Chat (Centro) */
        .main-chat {
            flex: 1;
            background-color: #0b0b0b;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 70px);
        }

        .chat-header {
            height: 48px;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #1a1a1a;
            font-weight: 600;
            color: #f2f3f5;
            gap: 8px;
            background-color: #0b0b0b;
            font-size: 0.95rem;
        }

        .chat-header span {
            font-size: 1.2rem;
            color: #6d6f78;
            font-weight: normal;
        }

        .chat-content {
            flex: 1;
            padding: 2.5rem 3rem;
            overflow-y: auto;
            max-width: 900px;
        }

        /* Estilo de Documentação Profissional */
        .page-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            font-size: 0.95rem;
            color: #80848e;
            margin-bottom: 2rem;
        }

        /* Caixa de Alerta Estilo Documentação (Callout) */
        .alert-box {
            background-color: rgba(239, 68, 68, 0.08); /* Vermelho bem suave de fundo */
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-left: 4px solid #ef4444; /* Detalhe lateral elegante */
            border-radius: 6px;
            padding: 1.25rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .alert-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            color: #d1d5db;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .alert-item span {
            font-size: 1.1rem;
            line-height: 1;
        }
    </style>
</head>
