<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHOOF</title>
    <!-- Ícone da aba do navegador (Favicon) -->
    <link rel="icon" type="image/png" href="imagens/logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            overflow: hidden;
        }

        /* Container do Fundo de Partículas */
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0b0b0b;
            z-index: 1;
        }

        /* Cabeçalho padronizado com a aba de Otimização */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 85px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3.5rem;
            z-index: 10;
            background: #000000;
        }

        /* Logo no topo esquerdo */
        .logo-container a {
            display: inline-block;
        }

        .logo-container img {
            height: 3.8rem;
            width: auto;
            display: block;
        }

        /* Menu centralizado perfeitamente */
        nav {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 1.8rem;
            align-items: center;
        }

        nav ul li a {
            text-decoration: none;
            color: #a0a0a0;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        nav ul li a:hover {
            color: #ffffff;
        }

        /* Bloco fantasma à direita para equilibrar o layout */
        .header-spacer {
            width: 3.8rem;
        }

        /* Texto Centralizado da Vitrine com tom ajustado e efeito de brilho (glow) */
        .conteudo-centro {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .texto-nhoof {
            font-size: 6rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: #dcdcdc;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.15), 0 0 40px rgba(0, 0, 0, 0.9);
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- Fundo Animado de Partículas (Particles.js) -->
    <div id="particles-js"></div>

    <!-- Cabeçalho com Logo na Esquerda e Menu Centralizado -->
    <header>
        <div class="logo-container">
            <a href="index.html">
                <img src="imagens/logo.png" alt="Logo">
            </a>
        </div>
        
        <nav>
            <ul>
                <li><a href="otimizacao/index.html">Otimização</a></li>
                <li><a href="#">Projeto 2</a></li>
                <li><a href="#">Projeto 3</a></li>
                <li><a href="#">Projeto 4</a></li>
                <li><a href="#">Projeto 5</a></li>
                <li><a href="#">Projeto 6</a></li>
                <li><a href="#">Projeto 7</a></li>
                <li><a href="#">Projeto 8</a></li>
                <li><a href="#">Projeto 9</a></li>
                <li><a href="#">Sobre</a></li>
            </ul>
        </nav>

        <div class="header-spacer"></div>
    </header>

    <!-- Vitrine Central -->
    <div class="conteudo-centro">
        <div class="texto-nhoof">NHOOF</div>
    </div>

    <!-- Script do Particles.js via CDN -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": {
                    "value": 110,
                    "density": { "enable": true, "value_area": 800 }
                },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": {
                    "value": 0.4,
                    "random": true
                },
                "size": {
                    "value": 2.5,
                    "random": true
                },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#ffffff",
                    "opacity": 0.25,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 0.7,
                    "direction": "none",
                    "random": false,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": { "enable": true, "mode": "grab" },
                    "onclick": { "enable": true, "mode": "push" },
                    "resize": true
                },
                "modes": {
                    "grab": { "distance": 160, "line_linked": { "opacity": 0.5 } },
                    "push": { "particles_nb": 3 }
                }
            },
            "retina_detect": true
        });
    </script>

    <!-- Script Centralizado do Site (Aplica o menu responsivo superior no telemóvel) -->
    <script src="js/main.js"></script>
</body>
</html>
